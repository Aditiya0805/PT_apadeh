<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
    <defs>
        <linearGradient id="bgTile" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#0F172A"/>
            <stop offset="100%" stop-color="#1E293B"/>
        </linearGradient>
        <linearGradient id="marbleBase" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#FFFFFF"/>
            <stop offset="50%" stop-color="#F8FAFC"/>
            <stop offset="100%" stop-color="#E2E8F0"/>
        </linearGradient>
        <filter id="shadowTile" x="-10%" y="-10%" width="120%" height="120%">
            <feDropShadow dx="0" dy="25" stdDeviation="30" flood-color="#000000" flood-opacity="0.6"/>
        </filter>
    </defs>
    <rect width="800" height="600" fill="url(#bgTile)"/>
    <circle cx="400" cy="300" r="230" fill="#E2E8F0" opacity="0.1" filter="blur(40px)"/>
    <!-- Granite Tile Perspective -->
    <g transform="translate(180, 80)" filter="url(#shadowTile)">
        <!-- Tile Block Base -->
        <polygon points="220,40 420,160 220,380 20,260" fill="url(#marbleBase)" stroke="#CBD5E1" stroke-width="3"/>
        <polygon points="20,260 220,380 220,400 20,280" fill="#94A3B8"/>
        <polygon points="220,380 420,160 420,180 220,400" fill="#64748B"/>
        <!-- Marble Veins -->
        <path d="M 80,180 Q 150,150 210,210 T 340,240" stroke="#94A3B8" stroke-width="4" fill="none" opacity="0.5"/>
        <path d="M 140,110 Q 220,180 260,140 T 360,190" stroke="#64748B" stroke-width="3" fill="none" opacity="0.4"/>
        <path d="M 180,270 Q 240,300 300,280" stroke="#94A3B8" stroke-width="2" fill="none" opacity="0.4"/>
        <!-- Gloss highlight sheen across tile -->
        <polygon points="120,100 260,180 200,260 60,180" fill="#FFFFFF" opacity="0.25"/>
    </g>
    <g transform="translate(60, 480)">
        <rect width="280" height="60" rx="14" fill="#1E293B" stroke="#E2E8F0" stroke-width="2"/>
        <text x="20" y="28" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="900" fill="#F8FAFC">GRANIT TILE 60X60 ROYAL</text>
        <text x="20" y="48" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#94A3B8">GLAZED POLISHED &bull; 1.44M²/DUS</text>
    </g>
</svg>