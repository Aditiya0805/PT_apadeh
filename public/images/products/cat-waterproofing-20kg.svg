<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
    <defs>
        <linearGradient id="bgWp" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#0F172A"/>
            <stop offset="100%" stop-color="#1E293B"/>
        </linearGradient>
        <linearGradient id="pailWp" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#F8FAFC"/>
            <stop offset="30%" stop-color="#FFFFFF"/>
            <stop offset="70%" stop-color="#E2E8F0"/>
            <stop offset="100%" stop-color="#CBD5E1"/>
        </linearGradient>
        <linearGradient id="cyanBanner" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#0284C7"/>
            <stop offset="100%" stop-color="#0369A1"/>
        </linearGradient>
        <filter id="shadowPail" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="25" stdDeviation="30" flood-color="#000000" flood-opacity="0.55"/>
        </filter>
    </defs>
    <rect width="800" height="600" fill="url(#bgWp)"/>
    <circle cx="400" cy="300" r="230" fill="#0284C7" opacity="0.14" filter="blur(40px)"/>
    <!-- Large 20kg Waterproofing Pail -->
    <g transform="translate(255, 90)" filter="url(#shadowPail)">
        <!-- Bucket Body -->
        <polygon points="30,80 260,80 235,390 55,390" fill="url(#pailWp)"/>
        <!-- Lid -->
        <ellipse cx="145" cy="80" rx="118" ry="24" fill="#0369A1"/>
        <ellipse cx="145" cy="74" rx="112" ry="20" fill="#38BDF8"/>
        <!-- Handle wire -->
        <path d="M 25,120 C 20,20 270,20 265,120" stroke="#94A3B8" stroke-width="7" fill="none"/>
        <rect x="120" y="30" width="50" height="14" rx="7" fill="#0F172A"/>
        <!-- Label on Pail -->
        <polygon points="34,140 256,140 240,310 50,310" fill="url(#cyanBanner)"/>
        <!-- Shield Water Droplet Motif -->
        <path d="M 145,170 C 120,200 120,230 145,245 C 170,230 170,200 145,170 Z" fill="#FFFFFF"/>
        <text x="145" y="278" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">AQUA-SHIELD</text>
        <text x="145" y="298" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#BAE6FD" text-anchor="middle" letter-spacing="1">PELAPIS ANTI BOCOR ELASTOMERIK</text>
        <rect x="95" y="335" width="100" height="28" rx="6" fill="#0F172A"/>
        <text x="145" y="354" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="800" fill="#38BDF8" text-anchor="middle">NETTO 20 KG</text>
    </g>
</svg>