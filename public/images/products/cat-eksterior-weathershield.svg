<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
    <defs>
        <linearGradient id="bgPaint" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#0F172A"/>
            <stop offset="100%" stop-color="#1E293B"/>
        </linearGradient>
        <linearGradient id="pailPaint" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#FFFFFF"/>
            <stop offset="50%" stop-color="#F1F5F9"/>
            <stop offset="100%" stop-color="#CBD5E1"/>
        </linearGradient>
        <linearGradient id="goldBanner" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#D97706"/>
            <stop offset="100%" stop-color="#B45309"/>
        </linearGradient>
        <filter id="shadowPaint" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="25" stdDeviation="30" flood-color="#000000" flood-opacity="0.55"/>
        </filter>
    </defs>
    <rect width="800" height="600" fill="url(#bgPaint)"/>
    <circle cx="400" cy="300" r="230" fill="#F59E0B" opacity="0.12" filter="blur(40px)"/>
    <g transform="translate(255, 90)" filter="url(#shadowPaint)">
        <polygon points="30,80 260,80 235,390 55,390" fill="url(#pailPaint)"/>
        <ellipse cx="145" cy="80" rx="118" ry="24" fill="#B45309"/>
        <ellipse cx="145" cy="74" rx="112" ry="20" fill="#FBBF24"/>
        <path d="M 25,120 C 20,20 270,20 265,120" stroke="#94A3B8" stroke-width="7" fill="none"/>
        <rect x="120" y="30" width="50" height="14" rx="7" fill="#0F172A"/>
        <polygon points="34,140 256,140 240,310 50,310" fill="url(#goldBanner)"/>
        <!-- Sun & Protection icon -->
        <circle cx="145" cy="200" r="25" fill="#FEF3C7"/>
        <circle cx="145" cy="200" r="16" fill="#F59E0B"/>
        <text x="145" y="258" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">WEATHERSHIELD</text>
        <text x="145" y="280" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#FEF3C7" text-anchor="middle" letter-spacing="1">CAT TEMBOK EKSTERIOR 20L</text>
        <rect x="95" y="335" width="100" height="28" rx="6" fill="#0F172A"/>
        <text x="145" y="354" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="800" fill="#FBBF24" text-anchor="middle">GARANSI 8 TAHUN</text>
    </g>
</svg>