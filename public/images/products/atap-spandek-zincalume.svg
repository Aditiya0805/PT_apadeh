<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
    <defs>
        <linearGradient id="bgRoof" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#0F172A"/>
            <stop offset="100%" stop-color="#1E293B"/>
        </linearGradient>
        <linearGradient id="metalGrad" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#CBD5E1"/>
            <stop offset="20%" stop-color="#F8FAFC"/>
            <stop offset="40%" stop-color="#94A3B8"/>
            <stop offset="60%" stop-color="#F8FAFC"/>
            <stop offset="80%" stop-color="#64748B"/>
            <stop offset="100%" stop-color="#CBD5E1"/>
        </linearGradient>
        <filter id="shadowRoof" x="-10%" y="-10%" width="120%" height="120%">
            <feDropShadow dx="0" dy="25" stdDeviation="25" flood-color="#000000" flood-opacity="0.6"/>
        </filter>
    </defs>
    <rect width="800" height="600" fill="url(#bgRoof)"/>
    <circle cx="400" cy="300" r="230" fill="#F59E0B" opacity="0.1" filter="blur(40px)"/>
    <!-- Corrugated Metal Roofing Sheet in 3D Perspective -->
    <g transform="translate(100, 100)" filter="url(#shadowRoof)">
        <!-- Corrugations -->
        <path d="M 60,60 L 520,60 L 460,340 L 0,340 Z" fill="url(#metalGrad)"/>
        <!-- Rib profiles -->
        <line x1="140" y1="60" x2="80" y2="340" stroke="#475569" stroke-width="12"/>
        <line x1="230" y1="60" x2="170" y2="340" stroke="#475569" stroke-width="12"/>
        <line x1="320" y1="60" x2="260" y2="340" stroke="#475569" stroke-width="12"/>
        <line x1="410" y1="60" x2="350" y2="340" stroke="#475569" stroke-width="12"/>
    </g>
    <g transform="translate(60, 480)">
        <rect width="300" height="60" rx="14" fill="#1E293B" stroke="#F59E0B" stroke-width="2"/>
        <text x="20" y="28" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="900" fill="#F59E0B">ATAP SPANDEK ZINCALUME</text>
        <text x="20" y="48" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#94A3B8">TEBAL 0.35MM &bull; ANTI BOCOR & KARAT</text>
    </g>
</svg>