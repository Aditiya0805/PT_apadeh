<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
    <defs>
        <linearGradient id="bgPipe" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#0F172A"/>
            <stop offset="100%" stop-color="#1E293B"/>
        </linearGradient>
        <linearGradient id="pvcGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#F8FAFC"/>
            <stop offset="30%" stop-color="#FFFFFF"/>
            <stop offset="70%" stop-color="#E2E8F0"/>
            <stop offset="100%" stop-color="#94A3B8"/>
        </linearGradient>
        <filter id="shadowPipe" x="-10%" y="-10%" width="120%" height="120%">
            <feDropShadow dx="0" dy="25" stdDeviation="25" flood-color="#000000" flood-opacity="0.6"/>
        </filter>
    </defs>
    <rect width="800" height="600" fill="url(#bgPipe)"/>
    <circle cx="400" cy="300" r="230" fill="#0284C7" opacity="0.1" filter="blur(40px)"/>
    <!-- PVC Pipe Assembly -->
    <g transform="translate(80, 160)" filter="url(#shadowPipe)">
        <!-- Pipe Main Body -->
        <rect x="60" y="100" width="520" height="90" rx="14" fill="url(#pvcGrad)"/>
        <!-- Socket Bell End (Left) -->
        <rect x="20" y="90" width="70" height="110" rx="16" fill="url(#pvcGrad)"/>
        <line x1="88" y1="90" x2="88" y2="200" stroke="#CBD5E1" stroke-width="4"/>
        <!-- Blue Red Line Identification Stripe -->
        <line x1="20" y1="145" x2="580" y2="145" stroke="#0284C7" stroke-width="6"/>
        <!-- Text on Pipe Body -->
        <text x="280" y="132" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="900" fill="#0369A1" letter-spacing="1">PIPA PVC KELAS AW 3" (89 MM) SNI</text>
        <text x="280" y="168" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#64748B">MAX PRESSURE 10 BAR &bull; TEBAL & ANTI PECAH</text>
    </g>
    <g transform="translate(460, 470)">
        <rect width="280" height="60" rx="14" fill="#1E293B" stroke="#0284C7" stroke-width="2"/>
        <text x="20" y="28" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="900" fill="#38BDF8">PIPA PVC AW 3 INCH SNI</text>
        <text x="20" y="48" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#94A3B8">PANJANG 4 METER &bull; SALURAN UTAMA</text>
    </g>
</svg>