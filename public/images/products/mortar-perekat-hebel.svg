<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
    <defs>
        <linearGradient id="bgMortar" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#0F172A"/>
            <stop offset="100%" stop-color="#1E293B"/>
        </linearGradient>
        <linearGradient id="bagMortarGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#F1F5F9"/>
            <stop offset="100%" stop-color="#E2E8F0"/>
        </linearGradient>
        <linearGradient id="blueBanner" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#2563EB"/>
            <stop offset="100%" stop-color="#1D4ED8"/>
        </linearGradient>
        <filter id="shadowMortar" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="25" stdDeviation="30" flood-color="#000000" flood-opacity="0.5"/>
        </filter>
    </defs>
    <rect width="800" height="600" fill="url(#bgMortar)"/>
    <circle cx="400" cy="300" r="230" fill="#3B82F6" opacity="0.12" filter="blur(40px)"/>
    <g stroke="#334155" stroke-width="1" opacity="0.35">
        <line x1="0" y1="200" x2="800" y2="200"/>
        <line x1="0" y1="400" x2="800" y2="400"/>
        <line x1="300" y1="0" x2="300" y2="600"/>
        <line x1="500" y1="0" x2="500" y2="600"/>
    </g>
    <!-- Bag -->
    <g transform="translate(245, 85)" filter="url(#shadowMortar)">
        <rect x="20" y="30" width="270" height="380" rx="22" fill="url(#bagMortarGrad)"/>
        <!-- Stitching -->
        <rect x="15" y="20" width="280" height="20" rx="6" fill="#94A3B8"/>
        <line x1="25" y1="30" x2="285" y2="30" stroke="#475569" stroke-width="3" stroke-dasharray="6,4"/>
        <rect x="15" y="400" width="280" height="20" rx="6" fill="#94A3B8"/>
        <line x1="25" y1="410" x2="285" y2="410" stroke="#475569" stroke-width="3" stroke-dasharray="6,4"/>
        <!-- Blue Banner -->
        <rect x="20" y="85" width="270" height="115" fill="url(#blueBanner)"/>
        <text x="155" y="130" font-family="'Plus Jakarta Sans', sans-serif" font-size="28" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">MORTAR UTAMA</text>
        <text x="155" y="158" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#93C5FD" text-anchor="middle" letter-spacing="2">THINBED PEREKAT BATA RINGAN</text>
        <!-- Brick trowel illustration inside bag -->
        <rect x="65" y="230" width="180" height="28" rx="6" fill="#0F172A"/>
        <text x="155" y="249" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" fill="#F8FAFC" text-anchor="middle">DAYA REKAT TINGGI 3MM</text>
        <text x="155" y="300" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="700" fill="#475569" text-anchor="middle">Semen Instan Serbaguna</text>
        <text x="155" y="325" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#64748B" text-anchor="middle">Hemat & Cepat Kering</text>
        <circle cx="155" cy="365" r="24" fill="#2563EB"/>
        <text x="155" y="367" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="900" fill="#FFFFFF" text-anchor="middle">40</text>
        <text x="155" y="379" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#BFDBFE" text-anchor="middle">KG</text>
    </g>
</svg>