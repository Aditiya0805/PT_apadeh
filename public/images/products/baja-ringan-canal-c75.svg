<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
    <defs>
        <linearGradient id="bgBaja" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#0F172A"/>
            <stop offset="100%" stop-color="#1E293B"/>
        </linearGradient>
        <linearGradient id="zincGrad" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#E2E8F0"/>
            <stop offset="25%" stop-color="#94A3B8"/>
            <stop offset="50%" stop-color="#F8FAFC"/>
            <stop offset="75%" stop-color="#64748B"/>
            <stop offset="100%" stop-color="#CBD5E1"/>
        </linearGradient>
        <filter id="shadowBaja" x="-10%" y="-10%" width="120%" height="120%">
            <feDropShadow dx="0" dy="20" stdDeviation="25" flood-color="#000000" flood-opacity="0.5"/>
        </filter>
    </defs>
    <rect width="800" height="600" fill="url(#bgBaja)"/>
    <circle cx="400" cy="300" r="230" fill="#38BDF8" opacity="0.1" filter="blur(40px)"/>
    <!-- Truss Profiles Diagram in perspective -->
    <g transform="translate(100, 160)" filter="url(#shadowBaja)">
        <!-- Truss Canal C Profiles -->
        <path d="M 50,40 L 550,40 L 530,120 L 30,120 Z" fill="#94A3B8"/>
        <!-- Front C Profile -->
        <path d="M 30,120 L 530,120 L 510,240 L 10,240 Z" fill="url(#zincGrad)"/>
        <!-- Profile Web Embossment / Stiffener Rib -->
        <line x1="40" y1="180" x2="520" y2="180" stroke="#334155" stroke-width="8" stroke-dasharray="40,20"/>
        <!-- Bottom lip -->
        <path d="M 10,240 L 510,240 L 530,265 L 30,265 Z" fill="#475569"/>
        <!-- Cross Section View on Left -->
        <g transform="translate(20, 70)">
            <path d="M 10,0 L 40,0 L 40,15 L 25,15 L 25,100 L 40,100 L 40,115 L 10,115 Z" fill="#F8FAFC" stroke="#0F172A" stroke-width="2"/>
            <text x="50" y="65" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" fill="#38BDF8">C75.75</text>
        </g>
    </g>
    <g transform="translate(480, 470)">
        <rect width="260" height="60" rx="14" fill="#1E293B" stroke="#38BDF8" stroke-width="2"/>
        <text x="20" y="28" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="900" fill="#38BDF8">BAJA RINGAN TRUSS C75</text>
        <text x="20" y="48" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#94A3B8">ZINCALUM ANTI KARAT &bull; 6M</text>
    </g>
</svg>