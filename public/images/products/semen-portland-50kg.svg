<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
    <defs>
        <linearGradient id="bgSemen" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#0F172A"/>
            <stop offset="100%" stop-color="#1E293B"/>
        </linearGradient>
        <linearGradient id="bagGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#E2E8F0"/>
            <stop offset="100%" stop-color="#CBD5E1"/>
        </linearGradient>
        <linearGradient id="accentRed" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#DC2626"/>
            <stop offset="100%" stop-color="#B91C1C"/>
        </linearGradient>
        <filter id="shadowBag" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="25" stdDeviation="30" flood-color="#000000" flood-opacity="0.5"/>
        </filter>
    </defs>
    <rect width="800" height="600" fill="url(#bgSemen)"/>
    <!-- Construction grid lines in background -->
    <g stroke="#334155" stroke-width="1" opacity="0.35">
        <line x1="0" y1="150" x2="800" y2="150"/>
        <line x1="0" y1="300" x2="800" y2="300"/>
        <line x1="0" y1="450" x2="800" y2="450"/>
        <line x1="200" y1="0" x2="200" y2="600"/>
        <line x1="400" y1="0" x2="400" y2="600"/>
        <line x1="600" y1="0" x2="600" y2="600"/>
    </g>
    <!-- Soft Glow -->
    <circle cx="400" cy="300" r="220" fill="#F97316" opacity="0.12" filter="blur(40px)"/>
    <!-- Cement Bag Graphic -->
    <g transform="translate(240, 80)" filter="url(#shadowBag)">
        <!-- Bag shape -->
        <rect x="20" y="30" width="280" height="390" rx="24" fill="url(#bagGrad)"/>
        <!-- Top fold stitching -->
        <rect x="15" y="20" width="290" height="22" rx="6" fill="#94A3B8"/>
        <line x1="25" y1="31" x2="295" y2="31" stroke="#475569" stroke-width="3" stroke-dasharray="6,4"/>
        <!-- Bottom fold stitching -->
        <rect x="15" y="410" width="290" height="20" rx="6" fill="#94A3B8"/>
        <line x1="25" y1="420" x2="295" y2="420" stroke="#475569" stroke-width="3" stroke-dasharray="6,4"/>
        <!-- Red Brand Banner -->
        <rect x="20" y="90" width="280" height="110" fill="url(#accentRed)"/>
        <!-- Emblem inside Banner -->
        <circle cx="160" cy="145" r="38" fill="#FFFFFF"/>
        <polygon points="160,118 178,155 142,155" fill="#DC2626"/>
        <circle cx="160" cy="144" r="8" fill="#F59E0B"/>
        <!-- Text on Bag -->
        <text x="160" y="240" font-family="'Plus Jakarta Sans', sans-serif" font-size="24" font-weight="800" fill="#0F172A" text-anchor="middle" letter-spacing="1">SEMEN PORTLAND</text>
        <text x="160" y="268" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="700" fill="#EA580C" text-anchor="middle" letter-spacing="3">TIPE PCC (KOMPOSIT)</text>
        <!-- Badges on bag -->
        <rect x="60" y="295" width="200" height="34" rx="8" fill="#0F172A"/>
        <text x="160" y="318" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#F8FAFC" text-anchor="middle" letter-spacing="1">STANDAR SNI 2049:2015</text>
        <!-- Weight badge -->
        <circle cx="160" cy="370" r="26" fill="#F8FAFC" stroke="#0F172A" stroke-width="3"/>
        <text x="160" y="371" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="900" fill="#0F172A" text-anchor="middle">50</text>
        <text x="160" y="384" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#64748B" text-anchor="middle">KG</text>
    </g>
    <!-- Tag overlay -->
    <rect x="520" y="100" width="130" height="34" rx="17" fill="#F97316"/>
    <text x="585" y="122" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">READY STOCK</text>
</svg>