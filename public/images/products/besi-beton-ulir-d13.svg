<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
    <defs>
        <linearGradient id="bgSteel" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#0F172A"/>
            <stop offset="100%" stop-color="#1E293B"/>
        </linearGradient>
        <linearGradient id="rebarGrad1" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#94A3B8"/>
            <stop offset="30%" stop-color="#E2E8F0"/>
            <stop offset="70%" stop-color="#64748B"/>
            <stop offset="100%" stop-color="#334155"/>
        </linearGradient>
        <linearGradient id="rebarGrad2" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#64748B"/>
            <stop offset="40%" stop-color="#CBD5E1"/>
            <stop offset="80%" stop-color="#475569"/>
            <stop offset="100%" stop-color="#1E293B"/>
        </linearGradient>
        <filter id="shadowRebar" x="-10%" y="-10%" width="120%" height="120%">
            <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000000" flood-opacity="0.6"/>
        </filter>
    </defs>
    <rect width="800" height="600" fill="url(#bgSteel)"/>
    <circle cx="400" cy="300" r="230" fill="#F59E0B" opacity="0.1" filter="blur(40px)"/>
    <!-- Construction technical blueprint grid -->
    <g stroke="#334155" stroke-width="1" opacity="0.3">
        <line x1="100" y1="0" x2="100" y2="600"/>
        <line x1="300" y1="0" x2="300" y2="600"/>
        <line x1="500" y1="0" x2="500" y2="600"/>
        <line x1="700" y1="0" x2="700" y2="600"/>
        <line x1="0" y1="200" x2="800" y2="200"/>
        <line x1="0" y1="400" x2="800" y2="400"/>
    </g>
    <!-- Steel Rebar Bars (Deformed Steel) -->
    <g transform="rotate(-15, 400, 300)" filter="url(#shadowRebar)">
        <!-- Bar 1 -->
        <rect x="80" y="220" width="640" height="38" rx="8" fill="url(#rebarGrad1)"/>
        <!-- Ribs on Bar 1 -->
        <g stroke="#334155" stroke-width="4" stroke-linecap="round" opacity="0.8">
            <line x1="120" y1="222" x2="135" y2="256"/><line x1="150" y1="222" x2="165" y2="256"/>
            <line x1="180" y1="222" x2="195" y2="256"/><line x1="210" y1="222" x2="225" y2="256"/>
            <line x1="240" y1="222" x2="255" y2="256"/><line x1="270" y1="222" x2="285" y2="256"/>
            <line x1="300" y1="222" x2="315" y2="256"/><line x1="330" y1="222" x2="345" y2="256"/>
            <line x1="360" y1="222" x2="375" y2="256"/><line x1="390" y1="222" x2="405" y2="256"/>
            <line x1="420" y1="222" x2="435" y2="256"/><line x1="450" y1="222" x2="465" y2="256"/>
            <line x1="480" y1="222" x2="495" y2="256"/><line x1="510" y1="222" x2="525" y2="256"/>
            <line x1="540" y1="222" x2="555" y2="256"/><line x1="570" y1="222" x2="585" y2="256"/>
            <line x1="600" y1="222" x2="615" y2="256"/><line x1="630" y1="222" x2="645" y2="256"/>
            <line x1="660" y1="222" x2="675" y2="256"/><line x1="690" y1="222" x2="705" y2="256"/>
        </g>
        <!-- Bar 2 (Front) -->
        <rect x="70" y="275" width="660" height="42" rx="8" fill="url(#rebarGrad1)"/>
        <g stroke="#1E293B" stroke-width="4.5" stroke-linecap="round" opacity="0.85">
            <line x1="110" y1="277" x2="128" y2="315"/><line x1="140" y1="277" x2="158" y2="315"/>
            <line x1="170" y1="277" x2="188" y2="315"/><line x1="200" y1="277" x2="218" y2="315"/>
            <line x1="230" y1="277" x2="248" y2="315"/><line x1="260" y1="277" x2="278" y2="315"/>
            <line x1="290" y1="277" x2="308" y2="315"/><line x1="320" y1="277" x2="338" y2="315"/>
            <line x1="350" y1="277" x2="368" y2="315"/><line x1="380" y1="277" x2="398" y2="315"/>
            <line x1="410" y1="277" x2="428" y2="315"/><line x1="440" y1="277" x2="458" y2="315"/>
            <line x1="470" y1="277" x2="488" y2="315"/><line x1="500" y1="277" x2="518" y2="315"/>
            <line x1="530" y1="277" x2="548" y2="315"/><line x1="560" y1="277" x2="578" y2="315"/>
            <line x1="590" y1="277" x2="608" y2="315"/><line x1="620" y1="277" x2="638" y2="315"/>
            <line x1="650" y1="277" x2="668" y2="315"/><line x1="680" y1="277" x2="698" y2="315"/>
        </g>
        <!-- Bar 3 (Bottom) -->
        <rect x="90" y="335" width="630" height="36" rx="8" fill="url(#rebarGrad2)"/>
        <!-- Steel Wire Tie Band -->
        <rect x="250" y="210" width="18" height="170" rx="4" fill="#F59E0B" stroke="#B45309" stroke-width="2"/>
        <rect x="520" y="210" width="18" height="170" rx="4" fill="#F59E0B" stroke="#B45309" stroke-width="2"/>
    </g>
    <!-- Label Badge -->
    <g transform="translate(60, 480)">
        <rect width="260" height="60" rx="14" fill="#1E293B" stroke="#F59E0B" stroke-width="2"/>
        <text x="20" y="28" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="900" fill="#F59E0B">BESI BETON ULIR D13</text>
        <text x="20" y="48" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#94A3B8">STANDAR SNI 2052:2017 &bull; 12M</text>
    </g>
</svg>